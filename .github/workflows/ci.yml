name: Payment safety
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: router
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: router_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U router"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://router:local_demo_only@localhost:5432/router_test
      WEBHOOK_SECRET: ci-only-signing-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify production APIs
        run: |
          npm start > /tmp/switchboard-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:3000 > /dev/null && break
            sleep 1
          done
          npm run test:http
