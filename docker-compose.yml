services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: router
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: router
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - router_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  router_data:
